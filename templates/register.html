{% extends "layout.html" %}

{% block title %} TimeWise: Register {% endblock %}

{% block body %}
<div class="form">
    <h1>Register</h1>
    {% if error %}
    <div class="error">
        <i class="bi bi-x-circle"></i>
        <p>{{ error }}</p>
    </div>
    {% endif %}
    <form action="/register" method="post">
        <table class="opt1">
            <tr>
                <td>Email address:</td>
                <td class="info"><input type="email" autofocus autocomplete="off" name="email" placeholder="Email" {% if email %} value = {{ email }} {% endif %} required></td>
            </tr>
            <tr>
                <td>Username:</td>
                <td class="info"><input type="text" autocomplete="off" name="username" placeholder="Username" {% if username %} value = {{ username }} {% endif %} required></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td class="info"><input type="password" autocomplete="off" name="password" placeholder="Password" required></td>
            </tr>
            <tr>
                <td>Confirm Password:</td>
                <td class="info"><input type="password" autocomplete="off" name="confirm" placeholder="Confirm Password" required></td>
            </tr>
            <tr>
                <td colspan="2" class="loginbtn">
                    <div class="button-wrap">
                        <button type="submit" onclick="this.disabled=true; this.innerText='Registering…'; this.form.submit();">Register</button>
                    </div>
                </td>
            </tr>
        </table>
    </form>
</div>
<form class="opt2" action="/login">
    <p>Already have an account?</p>
    <button class="register-btn">Login from here</button>
</div>
{% endblock %}
