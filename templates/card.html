<div class="card {% if task.status == 'pending' and task.overdue %}overdue{% endif %} p{{ task.priority }}">
    <form method="post" action="/view" class="toggle-task">
        <input type="hidden" name="filter" value="{{ filter }}">
        <input type="hidden" name="sort" value="{{ sort }}">
        <input type="hidden" name="search" value="{{ search }}">
        <input type="hidden" name="completed" value="{{ task.id }}">
        <button class="completed">{% if task.status == 'pending' %}<i class="bi bi-square"></i>{% else %}<i class="bi bi-check-square-fill" style="color: #89F336;"></i>{% endif %}</button>
    </form>
    <div class="content {%if task.status == 'completed' %}Completed{% endif %}">
        <div class="title-index">
            {% if task.status == 'pending' and task.overdue %}<span class="overdue-span"><i class="bi bi-exclamation-circle"></i> OVERDUE</span>{% endif %} 
            <h2> {{ task.title }} </h2>
            <a href="/edit?t={{ task.id }}"><i class="bi bi-pencil-square"></i></a>
        </div>
        <div class="other">
            <div class="desc index-desc">
                <p> {{ task.description }}</p>
            </div>
            <div class="task-info">
                <p>Due date: {{ task.due_date }}</p>
                <p>Status: {{ task.status }}</p>
                <p class="last">Category: {{ task.category }} <span class="priority-badge b{{ task.priority }}">{% if task.priority == 3 %}🔴 High{% elif task.priority ==2 %}🟡 Medium{% else %}🟢 Low{% endif %}</span></p>    
            </div>
        </div>
    </div>
</div>
