{% extends "layout.html" %}

{% block title %} TimeWise: Focus Session {% endblock %}

{% block body %}
    {% if error %}
    <div class="error">
        <i class="bi bi-x-circle"></i>
        <p>{{ error }}</p>
    </div>
    {% endif %}
    <div class="form-container">
    <h1 class="index"><img src="/static/timer.png" width="100" height="100"> Focus Timer!</h1>
        <form method="post" action="/focus-session">
            <input type="hidden" name="form_id" value="pomodoro">
            <div class="timer">
                <div class="timer-values">
                    <label for="hours">Hours:</label>
                    <input type="number" name="hours" id="hours" value=0>
                </div>
                <div class="timer-values">
                    <label for="mins">Mins:</label>
                    <input type="number" name="mins" id="mins" value=0>
                </div>
            </div>
            <div class="button-wrapper">
                <button type="submit" class="timer-btn" onclick="this.disabled=true; this.innerText='Starting session...'; this.form.submit();">Start session</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add("background")
        });
    </script>
{% endblock %}
